name: Metrics

on:
  # Atualiza uma vez por dia, às 06:00 UTC (03:00 em Florianópolis)
  schedule:
    - cron: "0 6 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # Roda também a cada push na branch principal
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # PAT clássico com escopo repo (e read:user). Salve em
          # Settings > Secrets and variables > Actions como METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: eduardoknopp
          template: classic
          base: header, repositories
          config_timezone: America/Sao_Paulo

          # Linguagens mais usadas, incluindo repositórios privados
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: no

          # Linhas de código adicionadas e removidas
          plugin_lines: yes
